version: '3.8'

services:
  app:
    build: .
    container_name: dhrubix-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=mongodb://admin:secret@mongodb:27017/dhrubix_ecom?replicaSet=rs0&authSource=admin
      - MONGO_URI=mongodb://admin:secret@mongodb:27017/dhrubix_ecom?replicaSet=rs0&authSource=admin
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - dhrubix-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo-key-init:
    image: busybox
    container_name: dhrubix-mongo-key-init
    user: root
    volumes:
      - mongo-data:/data/db
    command: >
      sh -c "
      echo 'dhrubixsupersecretkeyfilecontentforreplicaSet1234567890' > /data/db/mongo-keyfile &&
      chmod 400 /data/db/mongo-keyfile &&
      chown 999:999 /data/db/mongo-keyfile
      "

  mongodb:
    image: mongo:7-jammy
    container_name: dhrubix-mongo
    hostname: mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: dhrubix_ecom
    volumes:
      - mongo-data:/data/db
    networks:
      - dhrubix-network
    depends_on:
      mongo-key-init:
        condition: service_completed_successfully
    command: mongod --replSet rs0 --auth --bind_ip_all --keyFile /data/db/mongo-keyfile
    healthcheck:    
      test: ["CMD", "mongosh", "--username", "admin", "--password", "secret", "--authenticationDatabase", "admin", "--eval", "try { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}) } catch(e) {} if (!db.hello().isWritablePrimary) { throw new Error('Not primary yet'); }"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo-express:
    image: mongo-express:latest
    container_name: dhrubix-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret
      ME_CONFIG_MONGODB_URL: mongodb://admin:secret@mongodb:27017/?replicaSet=rs0&authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - dhrubix-network

volumes:
  mongo-data:
    driver: local

networks:
  dhrubix-network:
    driver: bridge
